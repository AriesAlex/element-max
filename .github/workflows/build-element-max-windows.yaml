name: Build Element Max for Windows

on:
    workflow_dispatch: {}

permissions:
    contents: write

concurrency:
    group: element-max-windows
    cancel-in-progress: false

jobs:
    build:
        runs-on: windows-2025
        defaults:
            run:
                shell: pwsh
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .node-version

            - name: Install native build prerequisites
              run: |
                  choco install -y magicsplat-tcl-tk nasm --no-progress
                  "$env:USERPROFILE/AppData/Local/Apps/Tcl86/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  "C:/Program Files/NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Configure MSVC
              uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
              with:
                  arch: x64

            - name: Build and publish Element Max
              env:
                  GH_TOKEN: ${{ github.token }}
              run: ./scripts/release-element-max.ps1 -SkipPagesDeployment

    deploy-pages:
        needs: build
        permissions:
            actions: write
            contents: read
            id-token: write
            pages: write
        uses: ./.github/workflows/deploy-element-max-pages.yaml
